# Локальний запуск усього Eventera в Docker. Запускати з кореня репо:
#   docker compose --env-file .env -f infra/docker-compose.yml up --build
#   docker compose --env-file .env -f infra/docker-compose.yml --profile jobs run --rm parser
# --env-file .env потрібен для build args фронтенду (VITE_*): compose підставляє ${...} з .env
# у теці compose-файлу (infra/), а не з env_file. Значення — у кореневому .env (див. .env.example).
name: eventera

services:
  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
        VITE_DONATE_URL: ${VITE_DONATE_URL:-}
        VITE_VIP_PAY_URL: ${VITE_VIP_PAY_URL:-}
        VITE_VIP_NOTE: ${VITE_VIP_NOTE:-}
        VITE_TELEGRAM_BOT_URL: ${VITE_TELEGRAM_BOT_URL:-https://t.me/Eventera_lviv_bot}
        VITE_ENABLE_GOOGLE: ${VITE_ENABLE_GOOGLE:-false}
    ports:
      - "8080:8080"
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    env_file: ../.env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  parser:
    build:
      context: ../backend
      dockerfile: ../infra/parser.Dockerfile
    env_file: ../.env
    profiles: ["jobs"]
    restart: "no"
