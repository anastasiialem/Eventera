# Render Blueprint для backend (API + Telegram-бот @Eventera_lviv_bot).
# Render → New → Blueprint → репозиторій → Blueprint Path: infra/render.yaml
# Значення з `sync: false` Render попросить ввести під час створення (беріть з backend/.env).
services:
  - type: web
    name: eventera-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./infra/backend.Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: ADMIN_CHAT_IDS
        sync: false
      - key: FRONTEND_URL
        sync: false
