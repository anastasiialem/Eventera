# nginx для зібраного frontend (SPA). Використовується в infra/frontend.Dockerfile.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml font/ttf font/otf;

    # Healthcheck для Docker / оркестратора
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Файли Vite з хешем в імені — кешуємо назавжди
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html завжди свіжий, щоб після деплою підтягувались нові assets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: /event/123, /waitlist, /auth/callback → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
