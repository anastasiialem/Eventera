name: Parser

# Collects Lviv events from Concert.ua and Karabas and writes them to Supabase.
# Runs every hour at :50, so new events are in the database before the
# Telegram notifications go out at :15 (notify.yml).
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:        # "Run workflow" button for a manual run

concurrency:
  group: parser
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/parser/requirements.txt

      - name: Install dependencies
        run: pip install -r parser/requirements.txt

      - name: Run tests
        run: python -m pytest parser/tests -q

      - name: Collect events and save to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m parser.run --db
